# Yannic's public, project-free high-trust profile.
# This removes approval prompts and grants full filesystem access.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"
personality = "pragmatic"
approvals_reviewer = "user"

[apps._default]
default_tools_approval_mode = "approve"
destructive_enabled = true
open_world_enabled = true

[desktop]
preventSleepWhileRunning = true
followUpQueueMode = "steer"
show-context-window-usage = true
keepRemoteControlAwakeWhilePluggedIn = true
selected-avatar-id = "codex"
dock-icon-preference = "codex-system"
reduced-motion-preference = "system"
open-local-url-in-target-preference = "external-browser"
avatar-overlay-mascot-width-px = 80
conversationDetailMode = "STEPS_COMMANDS"
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh"]
